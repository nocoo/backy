# Gitleaks config — allowlist E2E test fixtures and their documentation.
#
# The webhook token below is a permanent, intentional fixture for the
# `backy-test` project (in our isolated local D1/R2). It is not a real
# secret — it only authorizes uploads to the local test database which
# is wiped on each E2E run. We commit it so contributors can run E2E
# tests without provisioning a fresh token each time.

title = "backy gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "E2E test fixtures (backy-test webhook token) + non-secret CF Access AUD"
paths = [
  '''packages/api/src/lib/test-project\.ts''',
  '''src/lib/test-project\.ts''',
  '''packages/api/src/__tests__/handlers/db\.test\.ts''',
  '''apps/worker/src/__tests__/routes\.test\.ts''',
  '''e2e/api/config\.ts''',
  '''scripts/e2e-tests\.ts''',
  '''apps/worker/\.wrangler/tmp/''',
  '''docs/05-test-resource-isolation\.md''',
  '''apps/worker/wrangler\.toml''',
  '''docs/07-vite-web-migration-plan\.md''',
]
