name = "backy"
main = "src/index.ts"
compatibility_date = "2026-04-01"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "backy.hexly.ai", custom_domain = true },
]

[vars]
ENVIRONMENT = "production"
NEXT_PUBLIC_APP_VERSION = "1.8.0"
CF_ACCESS_TEAM_DOMAIN = "nocoo.cloudflareaccess.com"
CF_ACCESS_AUD = "677c4df5d98c379b766a18f6cff5d3a1162ae2e6c56aee835aa810a795e0d3d5"
# R2 binding doesn't natively support presigned URLs. Download/restore
# routes need an S3-compatible presigner; account id + bucket name live
# here, the access key/secret are loaded as Wrangler secrets at deploy
# time:
#   wrangler secret put R2_ACCESS_KEY_ID
#   wrangler secret put R2_SECRET_ACCESS_KEY
R2_ACCOUNT_ID = "d51a8fde361e4be31db17d8c56737c1f"
R2_BUCKET_NAME = "backy"

[[d1_databases]]
binding = "DB"
database_name = "backy-db"
database_id = "7ecc6581-6f0e-4e8c-8783-7e58b8676f93"

[[r2_buckets]]
binding = "R2"
bucket_name = "backy"

[assets]
directory = "./static"
binding = "ASSETS"
run_worker_first = ["/api/*"]
not_found_handling = "single-page-application"

[triggers]
crons = ["0 * * * *"]
