name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    uses: nocoo/base-ci/.github/workflows/bun-quality.yml@v2026
    with:
      bun-version: "1.3.5"
      test-command: "for f in src/__tests__/*.test.ts; do bun test "$f" || exit 1; done"
      typecheck-command: "bun run typecheck"
      enable-l2: "false"
    secrets: inherit
