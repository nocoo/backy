name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────────────
  # L1 + G1 + G2 — Core quality gate from base-ci
  #
  # Backy is a bun monorepo:
  #   apps/web      — Vite + React SPA (built into apps/worker/static/)
  #   apps/worker   — Hono on Cloudflare Workers (API + cron + assets)
  #   packages/api  — shared business logic
  #   apps/cli      — AI-facing CLI (skeleton)
  #
  # Root scripts forward into each workspace, so the standard
  # `bun run typecheck` / `bun run test:coverage` / `bun run gate:security`
  # commands cover all packages without per-workspace jobs.
  # ─────────────────────────────────────────────────────
  quality:
    uses: nocoo/base-ci/.github/workflows/bun-quality.yml@v2026.4
    with:
      bun-version: "1.3.11"
      typecheck-command: "bun run typecheck"
      test-command: "bun run test:coverage"
      osv-config: "osv-scanner.toml"
      enable-l2: "true"
      l2-command: "bun run test:e2e:api"
      enable-l3: "true"
      l3-command: "bun run test:e2e:bdd"
      l3-browser: "chromium"
      enable-worker: "false"
    secrets: inherit
