name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────────────
  # L1 + G1 + G2 — Core quality gate from base-ci
  #
  # Backy is a bun monorepo:
  #   apps/web      — Vite + React SPA (built into apps/worker/static/)
  #   apps/worker   — Hono on Cloudflare Workers (API + cron + assets)
  #   packages/api  — shared business logic
  #   apps/cli      — AI-facing CLI (skeleton)
  #   apps/web_legacy — frozen Next.js snapshot (deletion pending; see docs/07)
  #
  # Root scripts forward into each workspace, so the standard
  # `bun run typecheck` / `bun run test:coverage` / `bun run gate:security`
  # commands cover all packages without per-workspace jobs.
  #
  # L2 (API E2E) and L3 (Playwright) are not yet wired here. They will
  # be re-introduced once Wave B' lands streaming uploads + worker-side
  # E2E (the legacy L2/L3 suites still live in apps/web_legacy and only
  # run on demand via `bun run legacy:test:e2e:*`).
  # ─────────────────────────────────────────────────────
  quality:
    uses: nocoo/base-ci/.github/workflows/bun-quality.yml@v2026.1
    with:
      bun-version: "1.3.11"
      typecheck-command: "bun run typecheck"
      test-command: "bun run test:coverage"
      osv-config: "osv-scanner.toml"
      enable-l2: "false"
      enable-l3: "false"
      enable-worker: "false"
    secrets: inherit

  # ─────────────────────────────────────────────────────
  # CD — Deploy to Cloudflare Workers (production)
  #
  # Runs only on push-to-main (NOT on PRs), gated by `quality`.
  # Builds the SPA into apps/worker/static/ and runs `wrangler deploy`
  # for the prod env (custom domain backy.hexly.ai). The R2 secret
  # bindings are already provisioned via `wrangler secret put`.
  # ─────────────────────────────────────────────────────
  deploy:
    name: Deploy Worker (production)
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy-worker-production
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build SPA into apps/worker/static
        run: bun run build

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: apps/worker
          command: deploy

      - name: Verify /api/live
        run: |
          set -e
          for i in 1 2 3 4 5 6; do
            STATUS=$(curl -fsS -o /dev/null -w "%{http_code}" https://backy.hexly.ai/api/live || true)
            echo "attempt $i: status=$STATUS"
            # 401 means CF Access intercepted before reaching the worker —
            # that itself proves the deploy is live behind the gate.
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "401" ]; then
              echo "✅ Worker reachable (status $STATUS)"
              exit 0
            fi
            sleep 5
          done
          echo "❌ /api/live did not respond after 30s"
          exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "### Backy Deploy"
            echo ""
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Worker: deployed to \`backy\` (production)"
            echo "- Verify: https://backy.hexly.ai/api/live"
          } >> "$GITHUB_STEP_SUMMARY"
