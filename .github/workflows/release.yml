# Backy CD
# - CI green on main → deploy: continuous deploy of latest main
# - workflow_dispatch → deploy: manual redeploy
name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Worker (production)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: deploy-backy-production
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build SPA into apps/worker/static
        run: bun run build

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/worker
          command: deploy --env=""

      - name: Read version
        id: ver
        run: |
          VERSION=$(jq -r .version package.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Expected version: $VERSION"

      - name: Verify deployment
        run: |
          set -e
          EXPECTED="${{ steps.ver.outputs.version }}"
          for i in 1 2 3 4 5 6; do
            RESP=$(curl -fsS https://backy.hexly.ai/api/live || echo '{}')
            ACTUAL=$(echo "$RESP" | jq -r .version)
            echo "attempt $i: live=$ACTUAL expected=$EXPECTED"
            if [ "$ACTUAL" = "$EXPECTED" ]; then
              echo "✅ Live version matches $EXPECTED"
              exit 0
            fi
            sleep 5
          done
          echo "❌ /api/live did not report version $EXPECTED after 30s"
          exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "### Backy Deploy"
            echo ""
            echo "- Trigger: ${{ github.event_name }}"
            echo "- SHA: \`${{ github.event.workflow_run.head_sha || github.sha }}\`"
            echo "- Worker: \`backy\` (production)"
            echo "- Verify: https://backy.hexly.ai/api/live"
          } >> "$GITHUB_STEP_SUMMARY"
